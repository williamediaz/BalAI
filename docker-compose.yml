version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Password123!\" -Q \"SELECT 1\"" ]
      interval: 10s
      retries: 10
  web:
    build: ./src/BalAI.Web
    depends_on:
      - sqlserver
    ports:
      - "5000:80"
